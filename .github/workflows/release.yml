name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Tag must be vMAJOR.MINOR.PATCH.' }
          $version = $env:RELEASE_TAG.Substring(1)
          if ((Get-Content src/version.h -Raw) -notmatch ('STAT_WISP_VERSION_STRING "' + [regex]::Escape($version) + '"')) {
            throw 'Release tag does not match source version.'
          }
      - name: Build executable, installer, and checksums
        shell: pwsh
        run: |
          $header = Get-Content src/version.h -Raw
          if ($header -notmatch 'STAT_WISP_VERSION_STRING "(\d+\.\d+\.\d+)"') { throw 'Missing version.' }
          ./scripts/build-release.ps1 -Version $Matches[1]
      - name: Retain verified artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stat-wisp-windows-x64
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.txt
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download this run's verified artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run download $env:RUN_ID -n stat-wisp-windows-x64 -D dist
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed.' }
      - name: Prepare draft release with all assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = (Get-ChildItem dist -File).FullName
          gh release create $env:RELEASE_TAG @assets --verify-tag --draft --title "Stat Wisp $env:RELEASE_TAG" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
